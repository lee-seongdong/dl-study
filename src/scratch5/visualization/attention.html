<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>어텐션에서 크로스어텐션까지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 상단 고정 탭 3개. 탭마다 위에 "왜 필요한가" 세 칸, 아래에 구조 그림·직접 계산·개념 정리 보기 전환 */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --surface-2: #EDF0F4;
  --fg: #1A1E26;
  --muted: #586172;
  --line: #D8DDE6;
  --code-bg: #EBEFF4;
  --data: #2B62B8;   --data-fill: #DCE7F7;
  --op: #586172;     --op-fill: #E6E9EE;
  --train: #0E7A70;  --train-fill: #D7EFEC;
  --frozen: #64748B; --frozen-fill: #E4E8EE;
  --pred: #7646C9;   --pred-fill: #EAE2F8;
  --plain: #8A93A3;  --plain-fill: #F4F6F9;
  --heat: #2B62B8;   --on-heat: #FFFFFF;
  --t1: #2B62B8; --t2: #C4511F; --t3: #2E8540; --t4: #8A4FBF; --t5: #A9660C; --t6: #0E7A86;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151B; --surface: #1A1F28; --surface-2: #202631; --fg: #E5E9F0; --muted: #9AA4B4; --line: #2C3441; --code-bg: #161B23;
    --data: #6FA2F0; --data-fill: #172A47; --op: #9AA4B4; --op-fill: #252C38;
    --train: #45C2B4; --train-fill: #11332F; --frozen: #94A3B8; --frozen-fill: #262E3A;
    --pred: #B293F4; --pred-fill: #2B2345; --plain: #6B7586; --plain-fill: #1D232C;
    --heat: #6FA2F0; --on-heat: #0B1220;
    --t1: #6FA2F0; --t2: #F08A5D; --t3: #5FC27A; --t4: #B98CF0; --t5: #E5AE4E; --t6: #4EC3CF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151B; --surface: #1A1F28; --surface-2: #202631; --fg: #E5E9F0; --muted: #9AA4B4; --line: #2C3441; --code-bg: #161B23;
  --data: #6FA2F0; --data-fill: #172A47; --op: #9AA4B4; --op-fill: #252C38;
  --train: #45C2B4; --train-fill: #11332F; --frozen: #94A3B8; --frozen-fill: #262E3A;
  --pred: #B293F4; --pred-fill: #2B2345; --plain: #6B7586; --plain-fill: #1D232C;
  --heat: #6FA2F0; --on-heat: #0B1220;
  --t1: #6FA2F0; --t2: #F08A5D; --t3: #5FC27A; --t4: #B98CF0; --t5: #E5AE4E; --t6: #4EC3CF;
  color-scheme: dark;
}

body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.65; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-block: 32px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px;
}
header { display: grid; gap: 12px; min-width: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .05em; color: var(--muted); margin: 0; }
h1 { font-size: clamp(26px, 3.6vw, 36px); line-height: 1.25; font-weight: 700; letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
h2 { font-size: 22px; line-height: 1.35; font-weight: 700; margin: 0; text-wrap: balance; }
h3 { font-size: 15px; line-height: 1.4; font-weight: 700; margin: 0; }
p { margin: 0; max-width: 72ch; }
code { font-family: var(--font-mono); font-size: .88em; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 0; margin: 0; list-style: none; font-size: 13px; color: var(--muted); }
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; background: var(--kf); border: 1.5px solid var(--k); flex: none; }

.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin;
  margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tab {
  appearance: none; border: 0; background: none; color: var(--muted); cursor: pointer;
  font: inherit; text-align: left; padding: 10px 14px 9px; border-bottom: 2px solid transparent;
  display: grid; white-space: nowrap; flex: none;
}
.tab b { font-size: 14px; font-weight: 600; }
.tab small { font-family: var(--font-mono); font-size: 11px; letter-spacing: .02em; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); }
button:focus-visible, .part:focus-visible { outline: 2px solid var(--data); outline-offset: 2px; }

.panel { display: grid; gap: 18px; min-width: 0; }
.panel-head { display: grid; gap: 8px; min-width: 0; }
.why { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .why { grid-template-columns: minmax(0, 1fr); } }
.why > div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.why h4 { margin: 0; font-size: 12px; font-family: var(--font-mono); letter-spacing: .04em; color: var(--muted); font-weight: 500; }
.why .add { border-color: var(--train); }
.why .add h4 { color: var(--train); }
.why p { font-size: 14px; }

.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; background: var(--surface-2); border-radius: 8px; }
.seg button { appearance: none; border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.card-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; }
.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 7px; cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* 구조 그림 */
.svg-wrap { overflow-x: auto; min-width: 0; }
svg.arch { display: block; width: 100%; min-width: 820px; height: auto; font-family: var(--font-body); }
svg.arch .t { font-size: 12px; fill: var(--fg); text-anchor: middle; font-weight: 600; }
svg.arch .s { font-size: 10.5px; fill: var(--muted); font-family: var(--font-mono); text-anchor: middle; }
svg.arch .lab { font-size: 11.5px; fill: var(--muted); font-family: var(--font-mono); }
svg.arch .lab.c { text-anchor: middle; }
svg.arch .ln { stroke: var(--muted); stroke-width: 1.3; fill: none; }
svg.arch .ln.d { stroke-dasharray: 4 3; }
svg.arch .ln.res { stroke: var(--op); stroke-opacity: .8; }
svg.arch .ln.bus { stroke: var(--frozen); stroke-width: 2; }
svg.arch .ah { fill: var(--muted); }
svg.arch .frame { fill: none; stroke: var(--line); stroke-width: 1.2; }
svg.arch .part { cursor: pointer; outline: none; }
svg.arch .box { fill: var(--kf); stroke: var(--k); stroke-width: 1.2; }
svg.arch .ghost { fill: var(--kf); stroke: var(--k); stroke-width: 1; opacity: .55; }
svg.arch .part:hover .box, svg.arch .part:focus-visible .box { stroke-width: 2.2; }
svg.arch .part.on .box { stroke-width: 3; }
.fig { margin: 0; display: grid; gap: 10px; min-width: 0; }
.fig figcaption { font-size: 13px; color: var(--muted); max-width: 90ch; }
.info { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 12px; }
.info-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.info-top h3 { font-size: 16px; }
.badge { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--kf); color: var(--k); white-space: nowrap; }
.shape { font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.info p { font-size: 14px; }

/* 직접 계산 공통 */
.lab-intro { font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: 13px; padding: 3px 11px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }
.formula { font-family: var(--font-mono); font-size: 12.5px; background: var(--code-bg); border-radius: 8px; padding: 8px 10px; overflow-wrap: anywhere; line-height: 1.7; }
.formula b { font-weight: 600; }
.note { font-size: 13.5px; background: var(--surface-2); border-radius: 8px; padding: 10px 12px; max-width: none; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; white-space: nowrap; }
.tag::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: currentColor; flex: none; }
.f0 { color: var(--t1); } .f1 { color: var(--t2); } .f2 { color: var(--t3); } .f3 { color: var(--t4); } .f4 { color: var(--t5); } .f5 { color: var(--t6); }

/* 어텐션 탭 계산기 */
.lab1 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 920px) { .lab1 { grid-template-columns: minmax(0, 1fr); } }
.plane-box { display: grid; gap: 6px; min-width: 0; justify-items: center; }
.plane-box h3, .plane-box p { justify-self: stretch; }
svg.plane { display: block; width: 100%; max-width: 300px; height: auto; }
svg.plane.drag { touch-action: none; cursor: crosshair; }
svg.plane .gl { stroke: var(--line); stroke-width: 1; }
svg.plane .ax { stroke: var(--muted); stroke-width: 1; opacity: .7; }
svg.plane text { font-family: var(--font-mono); font-size: 11px; font-weight: 600; }
svg.plane .s0 { stroke: var(--t1); fill: var(--t1); } svg.plane .s1 { stroke: var(--t2); fill: var(--t2); }
svg.plane .s2 { stroke: var(--t3); fill: var(--t3); } svg.plane .s3 { stroke: var(--t4); fill: var(--t4); }
svg.plane .sq { stroke: var(--fg); fill: var(--fg); }
svg.plane .head { stroke: none; }
svg.plane text.s0, svg.plane text.s1, svg.plane text.s2, svg.plane text.s3, svg.plane text.sq { stroke: none; }
svg.plane .faint { opacity: .35; }
svg.plane .handle { fill: var(--surface); stroke: var(--fg); stroke-width: 2; cursor: grab; }
.wt { display: grid; grid-template-columns: auto auto auto minmax(70px, 1fr) auto; gap: 6px 12px; align-items: center; font-size: 13px; }
.wt .h { font-size: 11.5px; color: var(--muted); }
.wt .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; font-size: 12.5px; }
.bar { height: 10px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: currentColor; }
.ctrl { display: grid; gap: 8px; }
.ctrl label { font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.ctrl input[type="range"] { width: min(260px, 100%); accent-color: var(--data); }

/* 셀프어텐션 탭 */
svg.arcs { display: block; width: 100%; min-width: 520px; height: auto; }
svg.arcs .tk { font-size: 13px; text-anchor: middle; fill: var(--fg); cursor: pointer; }
svg.arcs .tk.on { font-weight: 700; fill: var(--heat); }
svg.arcs .arc { fill: none; stroke: var(--heat); stroke-linecap: round; }
svg.arcs .arc.masked { stroke: var(--muted); stroke-dasharray: 3 4; stroke-width: 1; opacity: .5; }
svg.arcs .wl { font-family: var(--font-mono); font-size: 11px; text-anchor: middle; fill: var(--fg); }
svg.arcs .wl.masked { fill: var(--muted); }
.stack { display: flex; height: 16px; border-radius: 4px; overflow: hidden; background: var(--surface-2); }
.stack i { display: block; height: 100%; background: currentColor; }

/* 행렬 그림 */
.mat-sec { display: grid; gap: 8px; min-width: 0; border-top: 1px solid var(--line); padding-top: 14px; }
svg.mat { display: block; width: 100%; height: auto; font-family: var(--font-mono); }
svg.mat .mc { stroke: var(--line); stroke-width: .6; cursor: pointer; }
svg.mat .mc.thin { stroke: none; }
svg.mat .mv { font-size: 11px; text-anchor: middle; pointer-events: none; font-variant-numeric: tabular-nums; }
svg.mat .mt { font-size: 12.5px; fill: var(--fg); font-family: var(--font-body); font-weight: 700; }
svg.mat .ml { font-size: 11px; fill: var(--muted); font-weight: 600; }
svg.mat .ml.e { text-anchor: end; }
svg.mat .ml.c { text-anchor: middle; }
svg.mat .op { font-size: 18px; fill: var(--muted); text-anchor: middle; font-family: var(--font-body); }
svg.mat .ln { stroke: var(--muted); stroke-width: 1.3; fill: none; }
svg.mat .ah { fill: var(--muted); }
svg.mat .mhl { fill: none; stroke: var(--fg); stroke-width: 2; pointer-events: none; }
svg.mat .mhl.soft { stroke-width: 1.2; stroke-dasharray: 3 2; }
svg.mat .tf0 { fill: var(--t1); } svg.mat .tf1 { fill: var(--t2); } svg.mat .tf2 { fill: var(--t3); }
svg.mat .tf3 { fill: var(--t4); } svg.mat .tf4 { fill: var(--t5); } svg.mat .tf5 { fill: var(--t6); }

/* 크로스어텐션 탭 */
.lab3 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 820px) { .lab3 { grid-template-columns: minmax(0, 1fr); } }
.pgrid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px; width: 100%; max-width: 440px; }
.pgrid button { appearance: none; border: 0; aspect-ratio: 1; max-width: 100%; border-radius: 4px; font: 500 10.5px var(--font-mono); cursor: pointer; padding: 0; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.pgrid button[aria-pressed="true"] { outline: 2.5px solid var(--fg); outline-offset: 1px; }
.axis-note { display: flex; justify-content: space-between; max-width: 440px; font-size: 11.5px; color: var(--muted); font-family: var(--font-mono); }
.rowbars { display: grid; grid-template-columns: auto minmax(80px, 1fr) auto; gap: 6px 12px; align-items: center; font-size: 13px; }

/* 개념 정리 */
.concepts { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
@media (max-width: 760px) { .concepts { grid-template-columns: minmax(0, 1fr); } }
.concept { padding: 12px 0; border-top: 1px solid var(--line); display: grid; gap: 4px; align-content: start; min-width: 0; }
.concept dt { font-weight: 700; font-size: 15px; }
.concept dd { margin: 0; display: grid; gap: 6px; }
.concept p { font-size: 14px; }
.concept .without { color: var(--muted); font-size: 13.5px; }
.concept .without b { color: var(--t2); font-weight: 600; }

[data-kind="data"] { --k: var(--data); --kf: var(--data-fill); }
[data-kind="op"] { --k: var(--op); --kf: var(--op-fill); }
[data-kind="train"] { --k: var(--train); --kf: var(--train-fill); }
[data-kind="frozen"] { --k: var(--frozen); --kf: var(--frozen-fill); }
[data-kind="pred"] { --k: var(--pred); --kf: var(--pred-fill); }
[data-kind="plain"] { --k: var(--plain); --kf: var(--plain-fill); }
@media (prefers-reduced-motion: no-preference) { .tab, .seg button, .chip, .pgrid button { transition: background-color .12s, color .12s, border-color .12s; } }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">scratch5 · step10 · Stable Diffusion의 텍스트 조건</p>
    <h1>어텐션에서 크로스어텐션까지</h1>
    <p>Stable Diffusion의 UNet이 텍스트 조건을 받는 방법을 세 단계로 나눠 봅니다. 탭마다 위에 필요한 이유를 두었고, 구조 그림에서 상자를 누르면 shape과 역할이 나옵니다. 직접 계산 보기에서는 값을 바꿔 가며 가중치가 어떻게 정해지는지 확인할 수 있습니다.</p>
    <ul class="legend" aria-label="색 구분">
      <li data-kind="data"><span class="sw"></span>계산된 값</li>
      <li data-kind="train"><span class="sw"></span>학습하는 파라미터</li>
      <li data-kind="frozen"><span class="sw"></span>SD 학습에서 고정된 값</li>
      <li data-kind="op"><span class="sw"></span>파라미터 없는 계산</li>
      <li data-kind="pred"><span class="sw"></span>층의 출력</li>
    </ul>
  </header>
  <nav class="tabs" role="tablist" aria-label="어텐션 종류" id="tabs"></nav>
  <main id="panels"></main>
</div>

<script>
const fmt = n => Number(n).toLocaleString('en-US');
const f2 = x => x.toFixed(2);
const KIND = { data: '계산된 값', train: '학습하는 파라미터', frozen: 'SD 학습에서 고정', op: '파라미터 없는 계산', pred: '층의 출력', plain: '어텐션 없는 단계' };

/* ------------------------------------------------------------ 탭 내용 */
const TABS = [
  {
    id: 'attn', name: '어텐션', sub: 'q·k·v와 softmax',
    lead: '각 토큰이 다른 토큰들의 v를 가중 평균해서 새 벡터를 만드는 층입니다. 가중치는 q와 k의 내적으로 입력마다 새로 계산합니다.',
    why: [
      ['앞 단계의 한계', '지금까지의 UNet은 합성곱과 완전연결층으로 만들었습니다. 합성곱은 3×3 커널 안의 이웃만 섞고, 완전연결층은 모든 입력을 섞지만 학습이 끝나면 섞는 비율이 고정됩니다.'],
      ['어텐션이 더한 것', '토큰마다 q, k, v를 만들고, q와 k의 내적으로 섞는 비율을 입력마다 새로 계산합니다. 그래서 거리와 관계없이 모든 토큰을 섞고, 섞는 비율도 입력에 따라 달라집니다.'],
      ['남은 한계', '마스크가 없는 어텐션은 토큰의 순서를 모르므로 위치 정보를 따로 더해야 합니다. 가중치 행렬이 토큰 수 × 토큰 수이므로, 토큰이 늘면 계산량이 제곱으로 늘어납니다.'],

    s += `<polyline class="ln${cls}" points="${p.map(q => q.join(',')).join(' ')}" marker-end="url(#${m})"/>`;
  }
  for (const t of D.texts || []) s += `<text class="lab${t.c ? ' c' : ''}" x="${t.x}" y="${t.y}">${t.t}</text>`;
  for (const n of D.nodes) {
    const kind = (D.detail[n.id] && D.detail[n.id][3]) || n.k;
    s += `<g class="part" data-kind="${kind}" data-id="${n.id}" tabindex="0" role="button" aria-label="${n.t}">`;
    if (n.r) {
      s += `<circle class="box" cx="${n.cx}" cy="${n.cy}" r="${n.r}"/><text class="t" x="${n.cx}" y="${n.cy + 4}">${n.t}</text>`;
    } else {
      if (n.stack) s += `<rect class="ghost" x="${n.x + 8}" y="${n.y - 8}" width="${n.w}" height="${n.h}" rx="7"/><rect class="ghost" x="${n.x + 4}" y="${n.y - 4}" width="${n.w}" height="${n.h}" rx="7"/>`;
      s += `<rect class="box" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="7"/>`;
      const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
      if (n.s) s += `<text class="t" x="${cx}" y="${cy - 3}">${n.t}</text><text class="s" x="${cx}" y="${cy + 12}">${n.s}</text>`;
      else s += `<text class="t" x="${cx}" y="${cy + 4}">${n.t}</text>`;
    }
    s += `</g>`;
  }
  return s + '</svg>';
}

function archView(tab) {
  const D = DIAGRAMS[tab.id];
  const wrap = document.createElement('div');
  wrap.className = 'card';
  wrap.innerHTML = `<figure class="fig"><div class="svg-wrap">${svgOf(D)}</div><figcaption>${D.caption}</figcaption></figure><div class="info" aria-live="polite"></div>`;
  const info = wrap.querySelector('.info');
  const select = id => {
    wrap.querySelectorAll('.part').forEach(g => g.classList.toggle('on', g.dataset.id === id));
    const d = D.detail[id];
    const node = D.nodes.find(n => n.id === id);
    const kind = d[3] || node.k;
    info.dataset.kind = kind;
    info.innerHTML = `<div class="info-top"><h3>${d[0]}</h3><span class="badge">${KIND[kind]}</span></div><div class="shape">${d[1]}</div><p>${d[2]}</p>`;
  };
  wrap.querySelectorAll('.part').forEach(g => {
    g.addEventListener('click', () => select(g.dataset.id));
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(g.dataset.id); } });
  });
  select(D.sel);
  return wrap;
}

/* ------------------------------------------------------------ 직접 계산: 어텐션 */
function arrow(x1, y1, x2, y2, cls, sw = 2) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);
  if (L < 1.5) return '';
  const ux = dx / L, uy = dy / L, hl = Math.min(9, L * 0.6), hw = hl * 0.55;
  const bx = x2 - ux * hl, by = y2 - uy * hl;
  return `<line x1="${x1}" y1="${y1}" x2="${bx}" y2="${by}" class="${cls}" stroke-width="${sw}"/><polygon class="${cls} head" points="${x2},${y2} ${bx - uy * hw},${by + ux * hw} ${bx + uy * hw},${by - ux * hw}"/>`;
}
const PX = x => 130 + x * 40, PY = y => 130 - y * 40;
function planeGrid() {
  let s = '';
  for (let i = -3; i <= 3; i++) {
    s += `<line class="gl" x1="${PX(i)}" y1="10" x2="${PX(i)}" y2="250"/><line class="gl" x1="10" y1="${PY(i)}" x2="250" y2="${PY(i)}"/>`;
  }
  return s + `<line class="ax" x1="10" y1="130" x2="250" y2="130"/><line class="ax" x1="130" y1="10" x2="130" y2="250"/>`;
}
function tipLabel(x, y, t, cls) {
  const L = Math.hypot(x, y) || 1;
  const lx = PX(x + (x / L) * 0.32), ly = PY(y + (y / L) * 0.32) + 4;
  return `<text class="${cls}" x="${lx}" y="${ly}" text-anchor="middle">${t}</text>`;
}

/* ------------------------------------------------------------ 행렬 그림 공통 */
function weightsFrom(sc, mode) {
  if (mode === 'argmax') { const m = sc.indexOf(Math.max(...sc)); return sc.map((_, i) => (i === m ? 1 : 0)); }
  const m = Math.max(...sc), ex = sc.map(s => Math.exp(s - m)), z = ex.reduce((a, b) => a + b, 0);
  return ex.map(e => e / z);
}
const f1 = x => x.toFixed(1);
const BASE = 'fill: var(--surface-2)';
const tint = k => `fill: color-mix(in srgb, var(--t${k + 1}) 30%, var(--surface))`;
const heatFill = w => { const p = Math.round(w * 100); return [`fill: color-mix(in srgb, var(--heat) ${p}%, var(--surface))`, p > 52 ? 'var(--on-heat)' : 'var(--fg)']; };
const mcell = (x, y, w, h, style, data, gap = 2) => `<rect class="mc${gap < 2 ? ' thin' : ''}" x="${x}" y="${y}" width="${w - gap}" height="${h - gap}" rx="${gap < 2 ? 0.5 : 2}" style="${style}" ${data}/>`;
const mtext = (x, y, t, color = 'var(--fg)') => `<text class="mv" x="${x}" y="${y}" style="fill:${color}">${t}</text>`;
const mhl = (x, y, w, h, soft) => `<rect class="mhl${soft ? ' soft' : ''}" x="${x - 1.5}" y="${y - 1.5}" width="${w + 3}" height="${h + 3}" rx="3"/>`;
const mt = (x, y, t) => `<text class="mt" x="${x}" y="${y}">${t}</text>`;
const ml = (x, y, t, cls = '') => `<text class="ml ${cls}" x="${x}" y="${y}">${t}</text>`;
const mop = (x, y, t) => `<text class="op" x="${x}" y="${y}">${t}</text>`;
const mArrow = id => `<defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker></defs>`;

      <h3>행렬로 보면</h3>
      <p class="small muted">토큰 4개가 모두 q를 내면 위 계산이 행마다 한 번씩 일어납니다. 행은 q를 낸 토큰이고, 열은 k를 낸 토큰입니다. 위 표의 가중치는 A의 A행이므로, q_A를 옮기면 S와 A의 A행만 바뀝니다. 칸을 누르면 그 칸을 만든 Q의 행과 Kᵀ의 열, 그 가중치가 곱해지는 V의 행이 표시됩니다.</p>
      <div class="svg-wrap"><svg class="mat" id="attnMat" viewBox="0 0 860 344" style="min-width:640px" role="img" aria-label="Q와 K의 전치를 곱해 S를 만들고, 행마다 softmax를 취한 A와 V를 곱해 O를 만드는 행렬 그림"></svg></div>
      <div class="formula" id="attnMatF"></div>
    </div>`;
  const [svgQ, svgV] = root.querySelectorAll('svg.plane');
  const gQ = svgQ.querySelector('.dyn'), gV = svgV.querySelector('.dyn');
  const wt = root.querySelector('#wt'), formula = root.querySelector('#formula');
  const matSvg = root.querySelector('#attnMat'), matF = root.querySelector('#attnMatF');
  let fi = 0, fj = 1;

  function update() {
    const raw = T.map(t => q[0] * t.k[0] + q[1] * t.k[1]);
    const sc = raw.map(r => r / Math.SQRT2 * c);
    const w = weightsFrom(sc, mode);
    const o = [0, 0];
    T.forEach((t, i) => { o[0] += w[i] * t.v[0]; o[1] += w[i] * t.v[1]; });

    let sq = '';
    T.forEach((t, i) => { sq += arrow(PX(0), PY(0), PX(t.k[0]), PY(t.k[1]), `s${i}`, 2) + tipLabel(t.k[0], t.k[1], `k_${t.n}`, `s${i}`); });
    sq += arrow(PX(0), PY(0), PX(q[0]), PY(q[1]), 'sq', 2.6) + tipLabel(q[0], q[1], 'q_A', 'sq');
    sq += `<circle class="handle" cx="${PX(q[0])}" cy="${PY(q[1])}" r="8" tabindex="0" role="slider" aria-label="q_A 위치" aria-valuetext="q_A = (${q[0].toFixed(1)}, ${q[1].toFixed(1)})"/>`;
    gQ.innerHTML = sq;

    let sv = '';
    T.forEach((t, i) => { sv += `<g class="faint">${arrow(PX(0), PY(0), PX(t.v[0]), PY(t.v[1]), `s${i}`, 1.5)}</g>` + tipLabel(t.v[0], t.v[1], `v_${t.n}`, `s${i}`); });
    let cx = 0, cy = 0;
    T.forEach((t, i) => {
      const nx = cx + w[i] * t.v[0], ny = cy + w[i] * t.v[1];
      sv += arrow(PX(cx), PY(cy), PX(nx), PY(ny), `s${i}`, 3.2);
      cx = nx; cy = ny;
    });
    sv += arrow(PX(0), PY(0), PX(o[0]), PY(o[1]), 'sq', 1.4) + `<circle cx="${PX(o[0])}" cy="${PY(o[1])}" r="4" class="sq"/>` + `<text class="sq" x="${PX(o[0]) + 8}" y="${PY(o[1]) - 8}">o_A</text>`;
    gV.innerHTML = sv;

    wt.innerHTML = `<span class="h">토큰</span><span class="h num">q_A·k</span><span class="h num">점수</span><span class="h">가중치</span><span class="h num"></span>` +
      T.map((t, i) => `<span class="tag f${i}">${t.n}</span><span class="num">${f2(raw[i])}</span><span class="num">${f2(sc[i])}</span><span class="bar f${i}"><i style="width:${(w[i] * 100).toFixed(1)}%"></i></span><span class="num">${f2(w[i])}</span>`).join('') +
      `<span></span><span></span><span class="h num">합</span><span></span><span class="num">${f2(w.reduce((a, b) => a + b, 0))}</span>`;
    formula.innerHTML = `o_A = ${T.map((t, i) => `<b class="f${i}">${f2(w[i])}</b>·v_${t.n}`).join(' + ')} = (${f2(o[0])}, ${f2(o[1])})`;

    const Qm = T.map((t, i) => (i === 0 ? q : t.q));
    const Sm = Qm.map(qr => T.map(t => (qr[0] * t.k[0] + qr[1] * t.k[1]) / Math.SQRT2 * c));
    const Am = Sm.map(row => weightsFrom(row, mode));
    const Om = Am.map(row => [0, 1].map(a => row.reduce((acc, x, j) => acc + x * T[j].v[a], 0)));
    matSvg.innerHTML = figAttn({ Q: Qm, K: T.map(t => t.k), V: T.map(t => t.v), S: Sm, A: Am, O: Om }, fi, fj);
    const n = T.map(t => t.n), qr = Qm[fi], kc = T[fj].k, cs = c.toFixed(2);
    matF.innerHTML = `S의 ${n[fi]}행 ${n[fj]}열 = q_${n[fi]}·k_${n[fj]} ÷ √2 × ${cs} = (${f1(qr[0])} × ${f1(kc[0])} + ${f1(qr[1])} × ${f1(kc[1])}) ÷ √2 × ${cs} = <b>${f2(Sm[fi][fj])}</b><br>` +
      `A의 ${n[fi]}행은 S의 ${n[fi]}행에 ${mode}를 적용한 값이고, ${n[fj]}열 값은 <b>${f2(Am[fi][fj])}</b>입니다.<br>` +
      `O의 ${n[fi]}행 o_${n[fi]} = ${Am[fi].map((x, j) => `<b class="f${j}">${f2(x)}</b>·v_${n[j]}`).join(' + ')} = (${f2(Om[fi][0])}, ${f2(Om[fi][1])})`;
  }

  const toPlane = ev => {
    const pt = svgQ.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    const p = pt.matrixTransform(svgQ.getScreenCTM().inverse());
    const clamp = v => Math.max(-3, Math.min(3, Math.round(v * 10) / 10));
    return [clamp((p.x - 130) / 40), clamp((130 - p.y) / 40)];
  };
  let dragging = false;
  svgQ.addEventListener('pointerdown', ev => { dragging = true; svgQ.setPointerCapture(ev.pointerId); q = toPlane(ev); update(); });
  svgQ.addEventListener('pointermove', ev => { if (dragging) { q = toPlane(ev); update(); } });
  const stop = () => { dragging = false; };
  svgQ.addEventListener('pointerup', stop); svgQ.addEventListener('pointercancel', stop);
  svgQ.addEventListener('keydown', ev => {
    const d = { ArrowLeft: [-0.1, 0], ArrowRight: [0.1, 0], ArrowUp: [0, 0.1], ArrowDown: [0, -0.1] }[ev.key];
    if (!d) return;
    ev.preventDefault();
    q = [Math.max(-3, Math.min(3, Math.round((q[0] + d[0]) * 10) / 10)), Math.max(-3, Math.min(3, Math.round((q[1] + d[1]) * 10) / 10))];
    update();
    svgQ.querySelector('.handle').focus();
  });
  root.querySelectorAll('#mode button').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.mode;
    root.querySelectorAll('#mode button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    update();
  }));
  const scale = root.querySelector('#scale'), scaleOut = root.querySelector('#scaleOut');
  scale.addEventListener('input', () => { c = Number(scale.value); scaleOut.textContent = `× ${c.toFixed(2)}`; update(); });
  root.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', () => { q = b.dataset.q.split(',').map(Number); update(); }));
  matSvg.addEventListener('click', e => {
    const t = e.target.closest('[data-m]');
    if (!t) return;
    if (t.dataset.i !== undefined) fi = Number(t.dataset.i);
    if (t.dataset.j !== undefined) fj = Number(t.dataset.j);
    update();
  });
  update();
  return root;
}

  a: { label: '달콤한 배를 먹었다', toks: ['달콤한', '배', '를', '먹었다'], sel: 1,
    W: [[.50, .35, .05, .10], [.55, .30, .05, .10], [.05, .45, .35, .15], [.10, .50, .10, .30]] },
  b: { label: '바다 위의 배를 탔다', toks: ['바다', '위', '의', '배', '를', '탔다'], sel: 3,
    W: [[.45, .15, .05, .25, .03, .07], [.40, .30, .10, .15, .02, .03], [.15, .35, .30, .15, .02, .03],
        [.45, .05, .05, .30, .05, .10], [.03, .02, .05, .50, .30, .10], [.10, .05, .02, .45, .08, .30]] },
};
function rowWeights(S, i, causal) {
  const sc = S.W[i].map((w, j) => (causal && j > i ? -Infinity : Math.log(w)));
  const m = Math.max(...sc.filter(Number.isFinite));
  const ex = sc.map(s => (Number.isFinite(s) ? Math.exp(s - m) : 0));
  const z = ex.reduce((a, b) => a + b, 0);
  return ex.map(e => e / z);
}
const heatStyle = w => {
  const p = Math.round(w * 100);
  return `background: color-mix(in srgb, var(--heat) ${p}%, var(--surface)); color: ${p > 52 ? 'var(--on-heat)' : 'var(--fg)'}`;
};

    const bae = key === 'a' ? '과일' : '탈것';

function labCross() {
  const G = 8;
  const MODES = {
    sent: { toks: ['왼쪽에', '고양이', '오른쪽에', '개'], score: (r, c) => {
      const g = (cr, cc) => 2.6 * Math.exp(-((r - cr) ** 2 + (c - cc) ** 2) / (2 * 1.4 ** 2));
      return [c < 4 ? 0.9 : 0, g(4.2, 1.8), c >= 4 ? 0.9 : 0, g(4.2, 5.8)];
    } },
    label: { toks: ['3'], score: () => [0] },
  };
  let mode = 'sent', tokSel = 1, cell = [4, 2];
  const weightsAt = (r, c) => {
    const sc = MODES[mode].score(r, c), m = Math.max(...sc), ex = sc.map(s => Math.exp(s - m)), z = ex.reduce((a, b) => a + b, 0);
    return ex.map(e => e / z);
  };
  const root = document.createElement('div');
  root.className = 'card';
  root.innerHTML = `
    <p class="lab-intro">8×8 칸은 64×64 위치를 줄여 그린 것입니다. 토큰을 누르면 그 토큰의 열 A[:, j]를 칸마다 보여주고, 칸을 누르면 그 위치의 행을 오른쪽에 보여줍니다. 가중치는 왼쪽 아래에 고양이, 오른쪽 아래에 개가 그려진다고 가정하고 정한 점수로 계산했습니다.</p>
    <div class="row">
      <div class="seg" id="cmode" role="group" aria-label="조건 선택">

        <button type="button" data-m="label" aria-pressed="false">레이블 하나: 3</button>
      </div>
    </div>
    <div class="lab3">
      <div style="display:grid;gap:8px;min-width:0">
        <div class="chips" id="ctoks" role="group" aria-label="토큰 선택"></div>
        <div class="pgrid" id="pgrid" role="group" aria-label="이미지 위치 8×8"></div>
        <div class="axis-note"><span>왼쪽</span><span>오른쪽</span></div>
        <p class="small muted" id="colSum"></p>
      </div>
      <div style="display:grid;gap:10px;min-width:0;align-content:start">
        <h3 id="rowTitle"></h3>
        <div class="rowbars" id="rowbars"></div>
        <div class="formula" id="cFormula"></div>
        <p class="note" id="cNote"></p>
      </div>
    </div>
    <div class="mat-sec">
      <h3>행렬로 보면</h3>
      <p class="small muted">A의 행 64개는 8×8 격자를 왼쪽 위부터 한 줄씩 펼친 위치이고, 열은 텍스트 토큰입니다. A의 칸을 누르면 그 위치와 토큰이 위에서 함께 선택됩니다.</p>
      <div class="svg-wrap"><svg class="mat" id="crossMat" role="img" aria-label="이미지 위치 64개의 Q와 텍스트 토큰의 K로 A를 만들고, A와 V로 위치별 출력을 만드는 행렬 그림"></svg></div>
      <div class="formula" id="crossMatF"></div>

  function render() {

    const w = weightsAt(cell[0], cell[1]);
    root.querySelector('#rowTitle').textContent = `${cell[0] + 1}행 ${cell[1] + 1}열 위치가 토큰을 참고하는 비율`;
    root.querySelector('#rowbars').innerHTML = toks.map((t, j) => `<span class="tag f${j}">${t}</span><span class="bar f${j}"><i style="width:${(w[j] * 100).toFixed(1)}%"></i></span><span class="num" style="font-family:var(--font-mono)">${f2(w[j])}</span>`).join('');
    root.querySelector('#cFormula').innerHTML = `o = ` + toks.map((t, j) => `<b class="f${j}">${f2(w[j])}</b>·v_${t}`).join(' + ');
    root.querySelector('#cNote').textContent = mode === 'label'
      ? '토큰이 하나뿐이면 softmax 결과가 모든 칸에서 1이므로, 모든 위치의 출력이 v_3으로 같습니다. 레이블 벡터 하나를 모든 위치에 더하는 02 노트북의 방식과 같은 결과입니다.'
      : '"고양이"와 "개"를 번갈아 누르면 같은 크로스어텐션 층에서 단어마다 다른 위치에 반영되는 것을 볼 수 있습니다. 실제 SD에서도 이 열을 64×64로 되돌려 그리면 단어별 위치 지도를 볼 수 있습니다.';

    const Wm = [];
    for (let r = 0; r < G; r++) for (let c = 0; c < G; c++) Wm.push(weightsAt(r, c));
    const ri = cell[0] * G + cell[1];
    const fig = figCross(Wm, toks, ri, tokSel);
    const ms = root.querySelector('#crossMat');
    ms.setAttribute('viewBox', `0 0 ${fig.W} ${fig.H}`);
    ms.style.minWidth = `${Math.round(fig.W * 0.72)}px`;
    ms.innerHTML = fig.s;
    root.querySelector('#crossMatF').textContent = `A의 ${ri + 1}번째 행은 격자의 ${cell[0] + 1}행 ${cell[1] + 1}열 위치이고, "${toks[tokSel]}" 열의 값은 ${f2(Wm[ri][tokSel])}입니다. 행 하나는 합이 1이고, 열 하나를 8×8로 되돌리면 왼쪽 격자가 됩니다.`;
  }
  root.querySelector('#crossMat').addEventListener('click', e => {
    const t = e.target.closest('[data-m]');
    if (!t) return;
    if (t.dataset.i !== undefined) { const i = Number(t.dataset.i); cell = [Math.floor(i / G), i % G]; }
    if (t.dataset.j !== undefined) tokSel = Number(t.dataset.j);
    render();
  });
  root.querySelectorAll('#cmode button').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.m;
    root.querySelectorAll('#cmode button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    tokSel = mode === 'sent' ? 1 : 0;
    render();
  }));
  render();
  return root;
}

const LABS = { attn: labAttn, self: labSelf, cross: labCross };

/* ------------------------------------------------------------ 탭과 보기 */
const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');
tabsEl.innerHTML = TABS.map(t => `<button class="tab" role="tab" id="tab-${t.id}" aria-controls="panel-${t.id}" aria-selected="false" tabindex="-1" data-tab="${t.id}"><b>${t.name}</b><small>${t.sub}</small></button>`).join('');

TABS.forEach(t => {
  const sec = document.createElement('section');
  sec.className = 'panel'; sec.id = `panel-${t.id}`; sec.setAttribute('role', 'tabpanel'); sec.setAttribute('aria-labelledby', `tab-${t.id}`);
  const cls = ['', 'add', ''];
  sec.innerHTML = `
    <div class="panel-head"><h2>${t.name}</h2><p>${t.lead}</p></div>
    <div class="why">${t.why.map((w, i) => `<div class="${cls[i]}"><h4>${w[0]}</h4><p>${w[1]}</p></div>`).join('')}</div>
    <div class="row"><div class="seg views" role="group" aria-label="보기 선택">
      <button type="button" data-v="arch" aria-pressed="true">구조 그림</button>
      <button type="button" data-v="lab" aria-pressed="false">직접 계산</button>
      <button type="button" data-v="concepts" aria-pressed="false">개념 정리</button>
    </div></div>
    <div class="view" data-view="arch"></div>
    <div class="view" data-view="lab" hidden></div>
    <div class="view" data-view="concepts" hidden><dl class="concepts">${t.concepts.map(c => `<div class="concept"><dt>${c[0]}</dt><dd><p>${c[1]}</p>${c[2] ? `<p class="without"><b>빠지면</b> ${c[2]}</p>` : ''}</dd></div>`).join('')}</dl></div>`;
  sec.querySelector('[data-view="arch"]').appendChild(archView(t));
  sec.querySelector('[data-view="lab"]').appendChild(LABS[t.id]());
  sec.querySelectorAll('.views button').forEach(b => b.addEventListener('click', () => {
    sec.querySelectorAll('.views button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    sec.querySelectorAll('.view').forEach(v => { v.hidden = v.dataset.view !== b.dataset.v; });
  }));
  panelsEl.appendChild(sec);
});

function setTab(id) {
  TABS.forEach(t => {
    const on = t.id === id;
    const b = document.getElementById(`tab-${t.id}`);
    b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1;
    document.getElementById(`panel-${t.id}`).hidden = !on;
  });
  try { localStorage.setItem('attn-tab', id); } catch (e) { /* 저장소를 쓸 수 없으면 기억하지 않는다 */ }
}
tabsEl.addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) setTab(b.dataset.tab); });
tabsEl.addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const i = TABS.findIndex(t => document.getElementById(`tab-${t.id}`).getAttribute('aria-selected') === 'true');
  const n = TABS[(i + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length];
  setTab(n.id); document.getElementById(`tab-${n.id}`).focus();
});
let start = 'attn';
try { const s = localStorage.getItem('attn-tab'); if (TABS.some(t => t.id === s)) start = s; } catch (e) { /* 기본 탭을 쓴다 */ }
setTab(start);
</script>
