<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>VAE에서 Stable Diffusion까지</title>

<style>
/* 레이아웃: 상단 고정 탭 6개. 탭마다 위에 "왜 필요한가" 세 칸, 아래에 구조 그림·개념 정리·학습 흐름·학습 결과 보기 전환 */
:root {

  --pred: #7646C9;   --pred-fill: #EAE2F8;
  --target: #A9660C; --target-fill: #F7E9CF;

    --data: #6FA2F0; --data-fill: #172A47; --op: #9AA4B4; --op-fill: #252C38;
    --train: #45C2B4; --train-fill: #11332F; --frozen: #94A3B8; --frozen-fill: #262E3A;
    --pred: #B293F4; --pred-fill: #2B2345; --target: #E5AE4E; --target-fill: #392C12;
    --loss: #F08A5D; --loss-fill: #3E2417;

  }
}
:root[data-theme="dark"] {
  --bg: #11151B; --surface: #1A1F28; --surface-2: #202631; --fg: #E5E9F0; --muted: #9AA4B4; --line: #2C3441;
  --code-bg: #161B23; --hl: #3D3414;

  --train: #45C2B4; --train-fill: #11332F; --frozen: #94A3B8; --frozen-fill: #262E3A;
  --pred: #B293F4; --pred-fill: #2B2345; --target: #E5AE4E; --target-fill: #392C12;

body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.65; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }

}
header { display: grid; gap: 12px; min-width: 0; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .05em; color: var(--muted); margin: 0; overflow-wrap: anywhere; }

p { margin: 0; max-width: 70ch; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 0; margin: 0; list-style: none; font-size: 13px; color: var(--muted); }

.tabs {

  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.tab {

  font: inherit; text-align: left; padding: 10px 14px 9px; border-bottom: 2px solid transparent;
  display: grid; gap: 0; white-space: nowrap; flex: none;
}
.tab b { font-size: 14px; font-weight: 600; color: inherit; }
.tab small { font-family: var(--font-mono); font-size: 11px; letter-spacing: .02em; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--fg); }

.panel { display: grid; gap: 18px; min-width: 0; }

.changes { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 2px 0 0; list-style: none; }

.changes .lbl { background: none; border: 0; padding-left: 0; color: var(--muted); font-family: var(--font-mono); font-size: 11.5px; }

.panel-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .panel-body { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.card-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }

.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; background: var(--surface-2); border-radius: 8px; }
.seg button {

  padding: 4px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line); font-weight: 600; }

.lab-grid { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 12px; }

.flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; counter-reset: step; align-content: start; }
.node {
  appearance: none; width: 100%; border: 1px solid transparent; background: none; color: var(--fg); font: inherit;
  text-align: left; cursor: pointer; border-radius: 7px; padding: 6px 8px;
  display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 2px 8px; align-items: center;
}
.node .num { width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; font-family: var(--font-mono); font-size: 11px; font-weight: 600; background: var(--kf); color: var(--k); }
.node .nl { font-size: 13.5px; line-height: 1.35; font-weight: 500; }
.node .ns { grid-column: 2; font-family: var(--font-mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.node:hover { background: var(--surface-2); }
.node[aria-current="step"] { background: var(--kf); border-color: var(--k); }
.node[aria-current="step"] .num { background: var(--k); color: var(--surface); }

.detail { display: grid; gap: 10px; align-content: start; min-width: 0; }
.info { display: grid; gap: 6px; }
.info-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }
.info-top h3 { font-size: 16px; }
.badge { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--kf); color: var(--k); white-space: nowrap; }
.shape { font-family: var(--font-mono); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.info p { font-size: 14px; }
.code { margin: 0; background: var(--code-bg); border-radius: 8px; padding: 10px 0; overflow-x: auto; font-family: var(--font-mono); font-size: 12px; line-height: 1.6; }
.code .ln { display: block; padding: 0 12px; white-space: pre; min-height: 1.6em; color: var(--fg); opacity: .5; }
.code .ln.on { opacity: 1; background: var(--hl); }
.code-cap { font-size: 12px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 8px; }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: 13px;
  padding: 4px 12px; border-radius: 7px; cursor: pointer;
}
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled { opacity: .4; cursor: default; }
.count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.ev { display: grid; gap: 12px; min-width: 0; }
.ev-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ev-tools .lbl { font-size: 12px; color: var(--muted); }
.grid-wrap { overflow-x: auto; min-width: 0; }
.igrid { display: grid; grid-template-columns: 84px repeat(var(--n), minmax(26px, 1fr)); gap: 3px 4px; align-items: center; min-width: calc(84px + var(--n) * 30px); }
.igrid .rl { font-size: 11.5px; line-height: 1.3; color: var(--muted); padding-right: 4px; }
.igrid .rl b { color: var(--fg); font-weight: 600; display: block; font-size: 12px; }
.igrid .ch { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); text-align: center; overflow-wrap: anywhere; line-height: 1.25; }
.igrid .cv { font-family: var(--font-mono); font-size: 10.5px; color: var(--fg); text-align: center; font-variant-numeric: tabular-nums; }
.igrid .hlrow { outline: 2px solid var(--k); outline-offset: 1px; border-radius: 2px; }
img.px { display: block; width: 100%; aspect-ratio: 1; image-rendering: pixelated; background: var(--pix-bg); border-radius: 2px; }
img.ph { display: block; width: 100%; height: auto; border-radius: 6px; background: var(--surface-2); }
.stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; }
.stats span { font-variant-numeric: tabular-nums; }
.stats b { font-family: var(--font-mono); font-weight: 600; }
.note { font-size: 13.5px; color: var(--fg); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; max-width: none; }
.note + .note { margin-top: -4px; }
.sd-row { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 8px; }
.sd-row figure { margin: 0; display: grid; gap: 4px; min-width: 0; }
.sd-row figcaption { font-size: 11.5px; color: var(--muted); line-height: 1.35; }
.sd-row figcaption b { color: var(--fg); font-weight: 600; }
.latent { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.3fr) minmax(0, 1.3fr); gap: 10px; align-items: start; }
.latent .chs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
@media (max-width: 480px) { .latent { grid-template-columns: minmax(0, 1fr); } }

.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 900px; font-size: 13.5px; }
th, td { text-align: left; vertical-align: top; padding: 9px 10px; border-bottom: 1px solid var(--line); }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
td.num { font-family: var(--font-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody th { color: var(--fg); font-size: 13.5px; white-space: nowrap; }
.points { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 75ch; }

.why { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 760px) { .why { grid-template-columns: minmax(0, 1fr); } }
.why > div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.why h4 { margin: 0; font-size: 12px; font-family: var(--font-mono); letter-spacing: .04em; color: var(--muted); font-weight: 500; }
.why .add { border-color: var(--train); }
.why .add h4 { color: var(--train); }
.why p { font-size: 14px; }
.views { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.svg-wrap { overflow-x: auto; min-width: 0; }
svg.arch { display: block; width: 100%; min-width: 760px; height: auto; font-family: var(--font-body); }
svg.arch .t { font-size: 12px; fill: var(--fg); }
svg.arch .b { font-weight: 600; }
svg.arch .s { font-size: 10.5px; fill: var(--muted); font-family: var(--font-mono); }
svg.arch .c { text-anchor: middle; }
svg.arch .e { text-anchor: end; }
svg.arch .chiptxt { fill: var(--k); font-weight: 600; }
svg.arch .skiptxt { fill: var(--data); }
svg.arch .ln { stroke: var(--muted); stroke-width: 1.3; fill: none; }
svg.arch .ln.thin { stroke-width: .8; stroke-opacity: .7; }
svg.arch .ln.d { stroke-dasharray: 4 3; }
svg.arch .ln.bus { stroke: var(--train); stroke-width: 2; }
svg.arch .ah { fill: var(--muted); }
svg.arch .ahd { fill: var(--data); }
svg.arch .edge { stroke: var(--train); stroke-opacity: .16; stroke-width: .8; }
svg.arch .part.on .edge { stroke-opacity: .75; stroke-width: 1.1; }
svg.arch .nr { fill: var(--surface); stroke: var(--muted); stroke-width: 1.2; }
svg.arch .nr.in { fill: var(--data-fill); stroke: var(--data); }
svg.arch .nr.out { fill: var(--pred-fill); stroke: var(--pred); }
svg.arch .eps { fill: var(--op-fill); stroke: var(--op); }
svg.arch .frame { fill: none; stroke: var(--line); }
svg.arch .hit { fill: var(--hl); fill-opacity: 0; }
svg.arch .part { cursor: pointer; outline: none; }
svg.arch .part:hover .hit { fill-opacity: .25; }
svg.arch .part:focus-visible .hit { fill-opacity: .4; }
svg.arch .part.on .hit { fill-opacity: .45; }
svg.arch .box { fill: var(--kf); stroke: var(--k); stroke-width: 1.2; }
svg.arch .part:hover .box, svg.arch .part:focus-visible .box { stroke-width: 2.2; }
svg.arch .part.on .box { stroke-width: 2.8; }
svg.arch .slab { fill: var(--surface-2); stroke: var(--muted); stroke-width: 1; }
svg.arch .slab.in { fill: var(--data-fill); stroke: var(--data); }
svg.arch .slab.out { fill: var(--pred-fill); stroke: var(--pred); }
svg.arch .slab.skip { fill: var(--data-fill); stroke: var(--data); }
svg.arch .part.on .slab { stroke: var(--fg); stroke-width: 2.2; }
svg.arch .skip { stroke: var(--data); stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
svg.arch .part.on .skip { stroke-width: 2.6; }
svg.arch .cell { fill: var(--surface-2); stroke: var(--line); }
svg.arch .cell.hot { fill: var(--pred-fill); stroke: var(--pred); stroke-width: 2; }

.concepts { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
@media (max-width: 760px) { .concepts { grid-template-columns: minmax(0, 1fr); } }
.concept { padding: 12px 0; border-top: 1px solid var(--line); display: grid; gap: 4px; align-content: start; min-width: 0; }
.concept dt { font-weight: 700; font-size: 15px; }
.concept dd { margin: 0; display: grid; gap: 6px; }
.concept p { font-size: 14px; }
.concept .without { color: var(--muted); font-size: 13.5px; }
.concept .without b { color: var(--loss); font-weight: 600; }

[data-kind="data"] { --k: var(--data); --kf: var(--data-fill); }
[data-kind="op"] { --k: var(--op); --kf: var(--op-fill); }
[data-kind="train"] { --k: var(--train); --kf: var(--train-fill); }
[data-kind="frozen"] { --k: var(--frozen); --kf: var(--frozen-fill); }
[data-kind="pred"] { --k: var(--pred); --kf: var(--pred-fill); }
[data-kind="target"] { --k: var(--target); --kf: var(--target-fill); }
[data-kind="loss"] { --k: var(--loss); --kf: var(--loss-fill); }
[data-kind="update"] { --k: var(--train); --kf: var(--train-fill); }
@media (prefers-reduced-motion: no-preference) { .node, .tab, .seg button { transition: background-color .12s, color .12s, border-color .12s; } }
</style>

    <h1>VAE에서 Stable Diffusion까지</h1>
    <p>탭마다 앞 단계에서 남은 한계와 이번 단계가 더한 것을 먼저 보여줍니다. 구조 그림에서 층이나 블록을 누르면 가중치 모양과 파라미터 수, 그 부분이 필요한 이유가 나옵니다. 개념 정리와 학습 흐름, 실제 학습 결과는 같은 탭의 다른 보기에 있습니다.</p>

const M = DATA.mnist, SD = DATA.sd;
const fmt = n => Number(n).toLocaleString('en-US');
const sum = o => Object.values(o).reduce((a, b) => a + b, 0);
const png = b => `<img class="px" alt="" src="data:image/png;base64,${b}">`;
const jpg = (b, alt) => `<img class="ph" alt="${alt || ''}" src="data:image/jpeg;base64,${b}">`;
const pngPhoto = (b, alt) => `<img class="ph" style="image-rendering:pixelated" alt="${alt || ''}" src="data:image/png;base64,${b}">`;
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const P = {
  vaeEnc: M.vae.params.encoder, vaeDec: M.vae.params.decoder,
  unet: sum(M.unet.params), diff: sum(M.diffusion.params), cond: sum(M.conditional.params),
  labelEmb: M.conditional.params.label_emb,
  sdUnet: SD.params.unet, sdText: SD.params.text_encoder, sdVae: SD.params.vae_encoder + SD.params.vae_decoder,
};

/* ---------------------------------------------------------------- 구조 그림 공통 */
const markers = () => `<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ah"/></marker>
  <marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="ahd"/></marker>
</defs>`;
const svgOpen = (w, h, label) => `<svg class="arch" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">${markers()}`;
const txt = (x, y, s, cls = 't c') => `<text class="${cls}" x="${x}" y="${y}">${s}</text>`;
const arrow = (x1, y1, x2, y2, cls = 'ln') => `<line class="${cls}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#ah)"/>`;
const box = (part, kind, x, y, w, h, title, sub) => `<g class="part" data-part="${part}" data-kind="${kind}"><rect class="box" x="${x}" y="${y}" width="${w}" height="${h}" rx="6"/>${txt(x + w / 2, y + (sub ? h / 2 - 2 : h / 2 + 4), title, 't c b')}${sub ? txt(x + w / 2, y + h / 2 + 12, sub, 's c') : ''}</g>`;
const chip = (part, kind, cx, cy, w, label, h = 18) => `<g class="part" data-part="${part}" data-kind="${kind}"><rect class="box" x="${cx - w / 2}" y="${cy - h / 2}" width="${w}" height="${h}" rx="5"/>${txt(cx, cy + 4, label, 's c chiptxt')}</g>`;
const convParams = (cin, cout, withMlp) => {
  const conv1 = cin * cout * 9 + cout, conv2 = cout * cout * 9 + cout, bn = 2 * cout;
  const mlp = withMlp ? (100 * cin + cin) + (cin * cin + cin) : 0;
  return { conv1, conv2, bn, mlp, total: conv1 + conv2 + 2 * bn + mlp };
};

/* ---------------------------------------------------------------- VAE: 뉴런 단위 */
function vaeSVG() {
  const gap = 22;
  const ys = (n, c) => Array.from({ length: n }, (_, i) => c + (i - (n - 1) / 2) * gap);
  const C = {
    x: { x: 180, ys: ys(12, 200), cls: 'in', dots: 6 },
    h: { x: 310, ys: ys(9, 200), dots: 4 },
    mu: { x: 445, ys: ys(5, 118) },
    lv: { x: 445, ys: ys(5, 282) },
    z: { x: 580, ys: ys(5, 200) },
    h2: { x: 710, ys: ys(9, 200), dots: 4 },
    xh: { x: 840, ys: ys(12, 200), cls: 'out', dots: 6 },
  };
  const idx = c => c.ys.map((_, i) => i).filter(i => i !== c.dots);
  const neurons = c => idx(c).map(i => `<circle class="nr ${c.cls || ''}" cx="${c.x}" cy="${c.ys[i]}" r="6.5"/>`).join('')
    + (c.dots !== undefined ? txt(c.x, c.ys[c.dots] + 4, '⋮', 's c') : '');
  const span = (...cs) => { const all = cs.flatMap(c => c.ys); return [Math.min(...all) - 10, Math.max(...all) + 10]; };
  const full = (part, a, b) => {
    const [y0, y1] = span(a, b);
    const lines = idx(a).flatMap(i => idx(b).map(j => `<line class="edge" x1="${a.x + 7}" y1="${a.ys[i]}" x2="${b.x - 7}" y2="${b.ys[j]}"/>`)).join('');
    return `<g class="part" data-part="${part}" data-kind="train">${lines}<rect class="hit" x="${a.x + 10}" y="${y0}" width="${b.x - a.x - 20}" height="${y1 - y0}"/></g>`;
  };
  const column = (part, c, kind = 'op') => {
    const [y0, y1] = span(c);
    return `<g class="part" data-part="${part}" data-kind="${kind}">${neurons(c)}<rect class="hit" x="${c.x - 13}" y="${y0}" width="26" height="${y1 - y0}" rx="6"/></g>`;
  };
  const reparam = [0, 1, 2, 3, 4].map(i => `<line class="ln thin" x1="${C.mu.x + 7}" y1="${C.mu.ys[i]}" x2="${C.z.x - 7}" y2="${C.z.ys[i]}"/><line class="ln thin" x1="${C.lv.x + 7}" y1="${C.lv.ys[i]}" x2="${C.z.x - 7}" y2="${C.z.ys[i]}"/><line class="ln thin d" x1="510" y1="292" x2="${C.z.x - 6}" y2="${C.z.ys[i] + 3}"/>`).join('');
  const input = M.vae.inputs[0], recon = M.vae.snapshots[M.vae.snapshots.length - 1].recon[0];
  return svgOpen(980, 390, 'VAE의 뉴런 구조: 입력 784, 은닉 200, 잠재 변수 20, 은닉 200, 출력 784')
    + `<g class="part" data-part="enc" data-kind="train"><path class="ln" d="M170 36 V28 H455 V36"/>${txt(312, 20, `인코더 · ${fmt(P.vaeEnc)}개`, 't c b')}<rect class="hit" x="170" y="6" width="285" height="32"/></g>`
    + `<g class="part" data-part="dec" data-kind="train"><path class="ln" d="M570 36 V28 H850 V36"/>${txt(710, 20, `디코더 · ${fmt(P.vaeDec)}개`, 't c b')}<rect class="hit" x="570" y="6" width="280" height="32"/></g>`
    + `<g class="part" data-part="img" data-kind="data"><image href="data:image/png;base64,${input}" x="34" y="164" width="72" height="72" style="image-rendering:pixelated"/><rect class="frame" x="34" y="164" width="72" height="72"/>${txt(70, 254, '28×28', 's c')}<rect class="hit" x="30" y="160" width="80" height="100"/></g>`
    + arrow(112, 200, 164, 200) + txt(138, 192, '펼치기', 's c')
    + full('linear', C.x, C.h) + full('linear_mu', C.h, C.mu) + full('linear_logvar', C.h, C.lv)
    + full('linear1', C.z, C.h2) + full('linear2', C.h2, C.xh)
    + `<g class="part" data-part="reparam" data-kind="op">${reparam}<path class="eps" d="M510 290 l8 8 l-8 8 l-8 -8 z"/>${txt(510, 326, 'ε ~ N(0, I)', 's c')}<rect class="hit" x="${C.mu.x + 10}" y="70" width="${C.z.x - C.mu.x}" height="250"/></g>`
    + column('x', C.x, 'data') + column('h', C.h) + column('mu', C.mu) + column('logvar', C.lv) + column('z', C.z) + column('h2', C.h2) + column('xhat', C.xh, 'pred')
    + txt(C.mu.x, 56, 'μ · 20') + txt(C.lv.x, 348, 'log σ² · 20')
    + [['x', '입력 · 784', ''], ['h', '은닉 · 200', 'ReLU'], ['z', 'z · 20', 'μ + σ·ε'], ['h2', '은닉 · 200', 'ReLU'], ['xh', '출력 · 784', 'sigmoid']]
      .map(([k, a, b]) => txt(C[k].x, 348, a) + (b ? txt(C[k].x, 363, b, 's c') : '')).join('')
    + arrow(850, 200, 884, 200)
    + `<g class="part" data-part="xhat" data-kind="pred"><image href="data:image/png;base64,${recon}" x="890" y="164" width="72" height="72" style="image-rendering:pixelated"/><rect class="frame" x="890" y="164" width="72" height="72"/>${txt(926, 254, '28×28로 되돌림', 's c')}<rect class="hit" x="886" y="160" width="80" height="100"/></g>`
    + '</svg>';
}

/* ---------------------------------------------------------------- UNet 계열: 텐서 단위 */
const UNET_T = [
  { id: 'x', ch: 1, r: 28, name: 'x' }, { id: 'x1', ch: 64, r: 28, name: 'x1' }, { id: 'p1', ch: 64, r: 14 },
  { id: 'x2', ch: 128, r: 14, name: 'x2' }, { id: 'p2', ch: 128, r: 7 }, { id: 'b', ch: 256, r: 7 },
  { id: 'u1', ch: 256, r: 14 }, { id: 'c2', ch: 384, r: 14, cat: [256, 128] }, { id: 'y2', ch: 128, r: 14 },
  { id: 'u2', ch: 128, r: 28 }, { id: 'c1', ch: 192, r: 28, cat: [128, 64] }, { id: 'y1', ch: 64, r: 28 },
  { id: 'y', ch: 1, r: 28, name: '출력' },
];
const UNET_OPS = [
  ['down1', 'conv', 1, 64], ['pool1', 'pool'], ['down2', 'conv', 64, 128], ['pool2', 'pool'], ['bot1', 'conv', 128, 256],
  ['ups2', 'up'], ['cat2', 'cat'], ['up2', 'conv', 384, 128], ['ups1', 'up'], ['cat1', 'cat'], ['up1', 'conv', 192, 64], ['out', 'out'],
];

function unetSVG(variant) {
  const withTime = variant !== 'plain';
  const X = i => 40 + i * 80;
  const RY = { 28: 100, 14: 222, 7: 305 }, RH = { 28: 100, 14: 52, 7: 28 };
  const W = ch => 4 + 1.8 * Math.sqrt(ch);
  const height = withTime ? 490 : 360;
  let s = svgOpen(1040, height, 'UNet의 텐서 구조: 28, 14, 7 해상도로 줄었다가 다시 28로 커지며 스킵 연결로 이어 붙임');
  const mids = [];
  UNET_OPS.forEach(([name, type], i) => {
    const a = UNET_T[i], b = UNET_T[i + 1];
    const x1 = X(i) + W(a.ch) / 2 + 2, y1 = RY[a.r], x2 = X(i + 1) - W(b.ch) / 2 - 4, y2 = RY[b.r];
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    mids.push([mx, my]);
    s += arrow(x1, y1, x2, y2);
    if (type === 'conv') s += chip(name, 'train', mx, my, 42, name);
    else if (type === 'out') s += chip(name, 'train', mx, my, 36, '1×1');
    else {
      const label = type === 'pool' ? 'maxpool' : type === 'up' ? 'upsample' : 'cat';
      const dx = type === 'cat' ? 0 : (y2 > y1 ? 30 : -30);
      const dy = type === 'cat' ? -8 : 0;
      s += `<g class="part" data-part="${name}" data-kind="op">${txt(mx + dx, my + dy, label, 's c')}<rect class="hit" x="${mx - 30 + dx}" y="${my - 14 + dy}" width="60" height="20"/></g>`;
    }
  });
  const skipX = i => { const t = UNET_T[i], w = W(t.ch); return X(i) + w / 2 - (w * t.cat[1] / t.ch) / 2; };
  s += `<g class="part" data-part="skip1" data-kind="data"><path class="skip" d="M${X(1)} 48 C${X(1)} 10, ${skipX(10)} 10, ${skipX(10)} 46" marker-end="url(#ahd)"/>${txt((X(1) + skipX(10)) / 2, 40, '스킵 연결 · x1의 64채널 복사', 's c skiptxt')}<rect class="hit" x="${X(1)}" y="8" width="${skipX(10) - X(1)}" height="36"/></g>`;
  s += `<g class="part" data-part="skip2" data-kind="data"><path class="skip" d="M${X(3)} 194 C${X(3)} 160, ${skipX(7)} 160, ${skipX(7)} 192" marker-end="url(#ahd)"/>${txt((X(3) + skipX(7)) / 2, 184, '스킵 연결 · x2의 128채널 복사', 's c skiptxt')}<rect class="hit" x="${X(3)}" y="160" width="${skipX(7) - X(3)}" height="28"/></g>`;
  UNET_T.forEach((t, i) => {
    const cx = X(i), cy = RY[t.r], h = RH[t.r], w = W(t.ch);
    const cls = i === 0 ? 'in' : i === UNET_T.length - 1 ? 'out' : '';
    let body;
    if (t.cat) {
      const w1 = w * t.cat[0] / t.ch;
      body = `<rect class="slab" x="${cx - w / 2}" y="${cy - h / 2}" width="${w1}" height="${h}"/><rect class="slab skip" x="${cx - w / 2 + w1}" y="${cy - h / 2}" width="${w - w1}" height="${h}"/>`;
    } else body = `<rect class="slab ${cls}" x="${cx - w / 2}" y="${cy - h / 2}" width="${w}" height="${h}"/>`;
    const chLabel = t.cat ? `${t.cat[0]}+${t.cat[1]}` : `${t.ch}`;

const RF = { x1: 5, p1: 6, x2: 14, p2: 16, b: 32 };
function unetParts(variant) {
  const withTime = variant !== 'plain';
  const parts = {};
  UNET_T.forEach((t, i) => {
    const shape = `(N, ${t.ch}, ${t.r}, ${t.r})`;
    let desc = '';
    if (t.id === 'x') desc = withTime ? '노이즈가 섞인 이미지 x_t입니다. VAE와 달리 펼치지 않고 (채널, 높이, 너비) 모양 그대로 넣습니다.' : '입력 이미지입니다. VAE와 달리 펼치지 않고 (채널, 높이, 너비) 모양 그대로 넣습니다.';
    else if (t.id === 'y') desc = withTime ? '입력과 같은 모양의 노이즈 예측 ε̂입니다. 이 값이 노이즈를 뜻하게 되는 것은 학습할 때 노이즈를 정답으로 주기 때문입니다.' : '입력과 같은 모양입니다. 이 값이 무엇을 뜻할지는 학습할 때 준 정답이 정합니다.';
    else if (t.cat) desc = `업샘플한 ${t.cat[0]}채널 뒤에 스킵 연결로 가져온 ${t.cat[1]}채널을 채널 방향으로 이어 붙입니다. 크기는 그대로이고 채널만 ${t.ch}개가 됩니다. 파란 부분이 복사해 온 채널입니다.`;
    else if (t.id === 'u1' || t.id === 'u2') desc = '채널은 그대로 두고 크기만 2배로 키운 텐서입니다. 새로 생긴 위치의 값은 주변 값의 보간이므로 세부 정보가 없습니다.';
    else if (RF[t.id]) desc = `값 하나가 입력 이미지의 ${RF[t.id]}×${RF[t.id]} 영역에 해당합니다.${t.id === 'b' ? ' 28×28보다 넓으므로, 가장 아래층의 값은 이미지 전체를 보고 계산됩니다.' : ''}${t.id === 'x1' || t.id === 'x2' ? ' 이 텐서를 복사해 디코더 쪽 같은 해상도에 이어 붙입니다.' : ''}`;
    else desc = 'ConvBlock 출력입니다.';
    parts[`t_${t.id}`] = { kind: i === 0 ? 'data' : i === UNET_T.length - 1 ? 'pred' : 'op', title: t.name ? `텐서 ${t.name}` : '중간 텐서', meta: `${shape} · 값 ${fmt(t.ch * t.r * t.r)}개`, desc };
  });
  UNET_OPS.forEach(([name, type, cin, cout]) => {
    if (type === 'conv') {
      const p = convParams(cin, cout, withTime);
      const mlpLine = withTime ? ` mlp가 v를 ${cin}채널로 바꿔 입력에 더한 뒤 합성곱을 시작합니다.` : '';
      parts[name] = { kind: 'train', title: `${name}: ConvBlock(${cin}, ${cout})`, meta: `파라미터 ${fmt(p.total)}개`,
        desc: `Conv2d(${cin}, ${cout}, 3)·BatchNorm·ReLU를 두 번 반복합니다. 첫 합성곱 ${fmt(p.conv1)}개, 두 번째 합성곱 ${fmt(p.conv2)}개, BatchNorm 두 개 ${fmt(p.bn * 2)}개${withTime ? `, mlp ${fmt(p.mlp)}개` : ''}입니다. 커널 모양은 (${cout}, ${cin}, 3, 3)이므로, 출력 채널 하나는 입력 ${cin}채널 전체의 3×3 영역을 보고 계산됩니다.${mlpLine}` };
    } else if (type === 'pool') parts[name] = { kind: 'op', title: 'MaxPool2d(2)', meta: '파라미터 0개', desc: '2×2 영역마다 가장 큰 값만 남겨 높이와 너비를 절반으로 줄입니다. 다음 합성곱의 3×3 커널이 원래 이미지의 더 넓은 영역을 보게 됩니다.' };
    else if (type === 'up') parts[name] = { kind: 'op', title: "Upsample(scale_factor=2, mode='bilinear')", meta: '파라미터 0개', desc: '쌍선형 보간으로 높이와 너비를 2배로 키웁니다. 학습하지 않으므로 줄이는 동안 잃은 세부 정보를 되살리지 못합니다.' };
    else if (type === 'cat') parts[name] = { kind: 'op', title: 'torch.cat([x, skip], dim=1)', meta: '파라미터 0개', desc: '높이와 너비가 같은 두 텐서를 채널 축으로 이어 붙입니다. 입력 크기가 4로 나누어떨어지지 않으면 두 텐서의 크기가 달라 여기서 오류가 발생합니다.' };
    else parts[name] = { kind: 'train', title: 'out: Conv2d(64, 1, 1)', meta: '가중치 1×64 + 편향 1 = 65개', desc: '위치마다 64채널 값을 가중합해 1채널로 줄입니다. 주변 위치는 보지 않습니다.' };
  });
  parts.skip1 = { kind: 'data', title: '스킵 연결 x1', meta: '(N, 64, 28, 28) 복사', desc: 'down1 출력을 저장해 두었다가 up1 앞에서 이어 붙입니다. 두 번의 maxpool과 upsample을 거친 특징에는 획의 정확한 위치가 남지 않으므로, 28×28 해상도의 원래 특징을 그대로 가져옵니다.' };
  parts.skip2 = { kind: 'data', title: '스킵 연결 x2', meta: '(N, 128, 14, 14) 복사', desc: 'down2 출력을 up2 앞에서 이어 붙입니다. 학습할 파라미터가 없고, 이어 붙인 뒤 up2가 두 정보를 섞습니다.' };
  if (withTime) {
    [['down1', 1], ['down2', 64], ['bot1', 128], ['up2', 384], ['up1', 192]].forEach(([name, cin]) => {
      parts[`mlp_${name}`] = { kind: 'train', title: `${name}.mlp`, meta: `Linear(100, ${cin})·ReLU·Linear(${cin}, ${cin}) · ${fmt(100 * cin + cin + cin * cin + cin)}개`,
        desc: `v를 ${cin}차원으로 바꾼 뒤 <code>v.view(N, C, 1, 1)</code>로 모양을 바꿔 입력 x에 더합니다. 채널마다 상수 하나를 모든 위치에 더하는 계산이므로, 같은 채널의 ${name === 'bot1' ? '7×7' : name === 'down2' || name === 'up2' ? '14×14' : '28×28'} 위치가 모두 같은 값만큼 이동합니다. 블록마다 mlp가 따로 있어, 같은 t라도 블록마다 다르게 반영됩니다.` };
    });
    parts.t = { kind: 'data', title: '시점 t', meta: '(N,) · 1~1000 정수', desc: variant === 'label' ? '학습할 때는 이미지마다 무작위로 뽑고, 생성할 때는 1000부터 1까지 내려갑니다.' : '학습할 때는 이미지마다 무작위로 뽑고, 생성할 때는 1000부터 1까지 내려갑니다.' };
    parts.pos = { kind: 'op', title: 'pos_encoding(timesteps, 100)', meta: '(N, 100) · 파라미터 0개', desc: '짝수 위치에는 sin(t / 10000^(i/100)), 홀수 위치에는 cos 값을 넣습니다. 주기가 다른 사인파 100개를 쓰므로, 가까운 t끼리는 비슷한 벡터가 되고 먼 t끼리는 다른 벡터가 됩니다.' };
  }
  if (variant === 'label') {
    parts.labels = { kind: 'data', title: 'labels', meta: '(N,) · 0~9 정수', desc: '학습할 때는 MNIST의 정답 레이블을 그대로 쓰고, 생성할 때는 만들 숫자를 직접 정합니다.' };
    parts.emb = { kind: 'train', title: 'label_emb: nn.Embedding(10, 100)', meta: '가중치 10×100 = 1,000개', desc: '숫자 10개에 대해 100차원 벡터를 하나씩 저장한 표입니다. labels 값으로 표의 행을 골라 꺼내므로 곱셈이 없고, 학습하면서 각 행이 바뀝니다.' };
    parts.plus = { kind: 'op', title: 't += self.label_emb(labels)', meta: '(N, 100)', desc: '시간 벡터와 레이블 벡터를 원소별로 더합니다. 이후 ConvBlock의 mlp는 두 정보가 합쳐진 벡터를 받습니다.' };
  }
  return parts;
}

  tokenizer: { kind: 'op', title: 'CLIPTokenizer', meta: '어휘 49,408개 · 최대 77 토큰', desc: () => `문장을 BPE 토큰으로 나누고 앞뒤에 시작·끝 토큰을 붙인 뒤 77개가 될 때까지 끝 토큰으로 채웁니다. 예시 프롬프트는 실제 토큰 ${SD.real_tokens}개이고 나머지 ${77 - SD.real_tokens}개는 채움 토큰입니다. 77개를 넘는 부분은 잘려 나갑니다.` },
  clip: { kind: 'frozen', title: 'CLIPTextModel', meta: () => `Transformer 12층 · 헤드 12개 · ${fmt(P.sdText)}개`, desc: '토큰 임베딩 49,408×768과 위치 임베딩 77×768을 더한 뒤 Transformer 층 12개를 거칩니다. 층 하나는 self-attention과 768 → 3072 → 768 MLP로 이루어지고 파라미터는 7,087,872개입니다. 이미지와 캡션의 짝을 맞히도록 미리 학습된 모델이고, Stable Diffusion을 학습할 때는 고치지 않습니다.' },
  temb: { kind: 'data', title: 'text_emb', meta: '(N, 77, 768)', desc: '토큰마다 768차원 벡터 하나씩, 모두 77개입니다. 레이블 임베딩은 벡터 하나였지만 텍스트 임베딩은 벡터의 열이므로, 시간 벡터에 더하지 않고 cross-attention으로 전달합니다.' },
  image: { kind: 'data', title: '이미지', meta: '(N, 3, 512, 512) · −1~1 범위', desc: '학습할 때만 쓰는 입력입니다. 값 786,432개로 이루어집니다.' },
  vae_enc: { kind: 'frozen', title: 'AutoencoderKL.encoder', meta: () => `${fmt(SD.params.vae_encoder)}개`, desc: '합성곱 블록 4단계로 채널을 128, 256, 512, 512로 늘리며 크기를 512에서 64로 줄입니다. 마지막 합성곱이 8채널을 내고, 앞 4채널은 μ, 뒤 4채널은 log σ²입니다. step7의 VAE와 같은 재매개변수화로 z를 뽑습니다.' },
  z0: { kind: 'op', title: '잠재 텐서 z0', meta: '(N, 4, 64, 64) · 값 16,384개', desc: '인코더 출력에 0.18215를 곱한 값입니다. 이미지보다 값이 48분의 1로 적지만 위치 구조는 유지합니다.' },
  noise: { kind: 'op', title: 'noise_scheduler.add_noise', meta: 'z_t = √ᾱ_t·z0 + √(1−ᾱ_t)·ε', desc: 'MNIST 확산모델의 <code>add_noise</code>와 같은 식을 잠재 텐서에 적용합니다.' },
  unet: { kind: 'train', title: 'UNet2DConditionModel', meta: () => `${fmt(P.sdUnet)}개 · 학습하는 유일한 부품`, desc: '해상도 64, 32, 16, 8의 4단계 U자 구조입니다. 위쪽 세 단계와 중간 블록에는 ResBlock 뒤에 attention 블록이 붙어 텍스트를 받습니다. 내부 구조는 "UNet 내부" 그림에 있습니다.' },
  eps: { kind: 'pred', title: '노이즈 예측 ε̂', meta: '(N, 4, 64, 64)', desc: '학습할 때는 섞은 노이즈와 MSE를 계산하고, 생성할 때는 스케줄러가 이 값으로 z를 한 단계 되돌립니다.' },
  t: { kind: 'data', title: '시점 t', meta: '0~999 정수', desc: 'diffusers는 시점을 0부터 셉니다. 생성할 때는 PNDMScheduler가 981부터 20씩 내려가는 50개 시점만 씁니다.' },
  time: { kind: 'train', title: 'time_embedding', meta: () => `Linear(320, 1280)·SiLU·Linear(1280, 1280) · ${fmt(SDA.timeEmb)}개`, desc: 't를 사인파 320차원으로 바꾼 뒤 MLP로 1280차원 벡터를 만듭니다. ResBlock 22개가 이 벡터를 각자 채널 수에 맞게 바꿔 특징 지도에 더합니다.' },
  vae_dec: { kind: 'frozen', title: 'AutoencoderKL.decoder', meta: () => `${fmt(SD.params.vae_decoder)}개`, desc: '생성의 마지막에 한 번만 호출합니다. z를 0.18215로 나눈 뒤 인코더를 거꾸로 한 구조로 512×512 이미지를 만듭니다.' },
  res: { kind: 'train', title: 'ResnetBlock2D', meta: 'GroupNorm·SiLU·Conv 3×3 두 번 + 잔차 연결', desc: '첫 합성곱 뒤에 시간 임베딩 1280차원을 Linear로 채널 수에 맞춰 더합니다. MNIST ConvBlock의 mlp와 같은 역할입니다. 입력을 출력에 더하는 잔차 연결이 있어 깊게 쌓아도 기울기가 전달됩니다. UNet 안에 22개가 있습니다.' },
  attn: { kind: 'train', title: 'Transformer2DModel', meta: () => `self-attention 16개 ${fmt(SDA.selfParams)}개 · cross-attention 16개 ${fmt(SDA.crossParams)}개`, desc: '특징 지도의 위치 하나하나를 토큰으로 보고 self-attention, cross-attention, feed-forward를 차례로 적용합니다. self-attention은 이미지 위치끼리, cross-attention은 이미지 위치와 텍스트 토큰을 연결합니다. 64×64 단계에서는 위치가 4,096개입니다.' },
  downs: { kind: 'op', title: 'Downsample2D', meta: 'stride 2 합성곱', desc: 'MNIST의 maxpool 대신 stride 2인 3×3 합성곱으로 크기를 절반으로 줄입니다. 줄이는 방법도 학습합니다.' },
  ups: { kind: 'op', title: 'Upsample2D', meta: 'nearest 2배 + 합성곱', desc: '크기를 2배로 키운 뒤 3×3 합성곱을 적용합니다.' },
  conv_in: { kind: 'train', title: 'conv_in: Conv2d(4, 320, 3)', meta: '11,840개', desc: '잠재 텐서 4채널을 320채널로 넓힙니다.' },
  conv_out: { kind: 'train', title: 'conv_out: Conv2d(320, 4, 3)', meta: '11,524개', desc: 'GroupNorm과 SiLU 뒤에 320채널을 노이즈 예측 4채널로 줄입니다.' },
  mid: { kind: 'op', title: '중간 블록', meta: () => `8×8 · ${fmt(SDA.mid.res + SDA.mid.attn)}개`, desc: 'ResBlock, attention, ResBlock 순서입니다. 8×8 위치 64개에서 이미지 전체의 구성을 계산합니다.' },
};
SDA.levels.forEach((lv, k) => {
  SD_PARTS[`lv${k}`] = { kind: 'op', title: `${lv.res}×${lv.res} 단계 · ${lv.ch}채널`, meta: `내려가는 쪽 ${fmt(lvSum(lv.down))}개 · 올라가는 쪽 ${fmt(lvSum(lv.up))}개`,
    desc: `${lv.down.attn ? `내려가는 쪽은 ResBlock과 attention 블록을 두 쌍 씁니다. 올라가는 쪽은 스킵 연결로 받은 특징을 이어 붙이며 세 쌍을 씁니다.` : 'attention 없이 ResBlock만 씁니다. 8×8에서는 위치가 64개뿐이므로 텍스트를 위치별로 나눠 받을 이점이 적습니다.'} 올라가는 쪽은 이어 붙인 채널까지 처리하므로 내려가는 쪽보다 파라미터가 많습니다.` };
});
const CROSS_PARTS = {
  feat: { kind: 'op', title: '이미지 특징', meta: '64×64 단계에서 (N, 4096, 320)', desc: '특징 지도의 위치 하나가 토큰 하나입니다. 강조한 칸 하나가 아래 계산에서 Q 벡터 하나가 됩니다.' },
  q: { kind: 'train', title: 'to_q: Linear(320, 320)', meta: '102,400개 · 편향 없음', desc: '이미지 위치마다 "이 위치에 필요한 정보"를 나타내는 Q 벡터를 만듭니다.' },
  k: { kind: 'train', title: 'to_k: Linear(768, 320)', meta: '245,760개 · 편향 없음', desc: '토큰마다 "이 토큰이 가진 정보의 종류"를 나타내는 K 벡터를 만듭니다. 텍스트 768차원을 이미지 쪽 320차원에 맞춥니다.' },
  v: { kind: 'train', title: 'to_v: Linear(768, 320)', meta: '245,760개 · 편향 없음', desc: '토큰마다 실제로 전달할 V 벡터를 만듭니다.' },
  weights: { kind: 'op', title: 'attention 가중치', meta: '헤드 8개 × 40차원', desc: 'Q와 K의 내적을 √40으로 나누고 softmax를 적용하면, 위치마다 토큰 77개에 대한 가중치가 나오고 그 합은 1입니다. 320차원을 40차원씩 8개 헤드로 나눠 따로 계산합니다.' },
  out: { kind: 'op', title: '가중합과 출력', meta: 'to_out: Linear(320, 320)', desc: '가중치로 V 벡터 77개를 가중합하면 위치마다 320차원 벡터가 나옵니다. to_out을 거쳐 원래 특징에 더하므로, 위치마다 다른 단어 정보가 더해집니다.' },
  tokens: { kind: 'data', title: 'text_emb', meta: '(N, 77, 768)', desc: () => `예시 프롬프트의 실제 토큰입니다. 같은 text_emb가 UNet 안의 cross-attention ${SDA.crossLayers}곳에 모두 들어갑니다.` },
};

const ARCH = {
  vae: [{ label: '뉴런 구조', svg: vaeSVG, parts: () => VAE_PARTS, first: 'linear',
    cap: '원은 뉴런이고 선은 가중치입니다. 784개와 200개 층은 일부만 그렸습니다. 층이나 연결선 묶음을 누르면 설명이 바뀝니다.' }],
  unet: [{ label: '텐서 구조', svg: () => unetSVG('plain'), parts: () => unetParts('plain'), first: 'skip1',
    cap: '막대 높이는 해상도, 너비는 채널 수를 나타냅니다. 막대 하나가 (채널, 높이, 너비) 텐서 하나이고, 초록 칩이 학습하는 블록입니다.' }],
  diffusion: [{ label: '텐서 구조', svg: () => unetSVG('time'), parts: () => unetParts('time'), first: 'mlp_down2',
    cap: '01의 UNet에 아래쪽 시간 경로가 추가되었습니다. 시간 벡터 v가 ConvBlock 다섯 곳에 각자의 mlp를 거쳐 들어갑니다.' }],
  conditional: [{ label: '텐서 구조', svg: () => unetSVG('label'), parts: () => unetParts('label'), first: 'emb',
    cap: '확산모델 구조에서 레이블 경로만 추가되었습니다. 레이블 벡터는 시간 벡터에 더해진 뒤 같은 경로로 들어갑니다.' }],
  sd: [
    { label: '전체', svg: sdSVG, parts: () => SD_PARTS, first: 'vae_enc', cap: '회색은 미리 학습해 고정한 부품이고, 초록은 Stable Diffusion을 학습할 때 고치는 부품입니다.' },
    { label: 'UNet 내부', svg: sdUnetSVG, parts: () => SD_PARTS, first: 'attn', cap: 'Res는 ResnetBlock2D, Attn은 Transformer2DModel입니다. 같은 행은 같은 해상도이고, 점선은 스킵 연결입니다.' },
    { label: 'cross-attention', svg: crossSVG, parts: () => CROSS_PARTS, first: 'weights', cap: '64×64 단계의 cross-attention 하나입니다. 32×32, 16×16 단계에서는 위치 수와 채널 수만 다릅니다.' },
  ],
};


/* ---------------------------------------------------------------- 실제 학습 결과 */
const head = labels => `<span></span>${labels.map(l => `<span class="ch">${l}</span>`).join('')}`;
const row = (label, cells, cls = '') => `<span class="rl ${cls}">${label}</span>${cells.join('')}`;
const grid = (n, body) => `<div class="grid-wrap"><div class="igrid" style="--n:${n}">${body}</div></div>`;
const seg = (key, items, cur) => `<div class="seg" role="group">${items.map((it, i) => `<button type="button" data-${key}="${i}" aria-pressed="${i === cur}">${it}</button>`).join('')}</div>`;
const epochLabel = e => e === 0 ? '학습 전' : `${e} 에폭`;

const EVIDENCE = {
  vae(st) {
    const snaps = M.vae.snapshots;
    const s = snaps[st.pick ?? snaps.length - 1];
    const sigma = s.sigma0.reduce((a, b) => a + b, 0) / s.sigma0.length;
    return `
      <div class="ev-tools"><span class="lbl">학습 시점</span>${seg('pick', snaps.map(x => epochLabel(x.epoch)), st.pick ?? snaps.length - 1)}</div>
      ${grid(8, row('<b>입력</b>시험 이미지', M.vae.inputs.map(png))
        + row('<b>재구성</b>인코더 μ를 디코더에', s.recon.map(png))
        + row('<b>생성</b>z ~ N(0, I)를 디코더에', s.samples.map(png)))}
      <div class="stats"><span>재구성 오차 <b>${s.recon_loss.toFixed(1)}</b></span><span>KL <b>${s.kl_loss.toFixed(1)}</b></span><span>첫 이미지의 σ 평균 <b>${sigma.toFixed(3)}</b></span></div>
      <p class="note">${NOTES.vae}</p>`;
  },
  unet(st, tab) {
    const runs = M.unet.runs;
    const i = st.pick ?? 3;
    const target = tab.modes[st.mode].target;
    const a = runs.x0[i], b = runs.eps[i];
    const stepLabel = n => n === 0 ? '학습 전' : n === 469 ? '1 에폭' : `${n} 스텝`;
    return `
      <div class="ev-tools"><span class="lbl">학습 시점</span>${seg('pick', runs.x0.map(r => stepLabel(r.step)), i)}</div>
      ${grid(6, row('<b>원본 x</b>', M.unet.x0.map(png))
        + row('<b>노이즈 eps</b>', M.unet.eps.map(png))
        + row('<b>입력 x_noisy</b>', M.unet.xt.map(png))
        + row(`<b>출력</b>정답: 원본<br>MSE ${a.mse.toFixed(4)}`, a.out.map(png), target === 'x0' ? 'hlrow' : '')
        + row(`<b>출력</b>정답: 노이즈<br>MSE ${b.mse.toFixed(4)}`, b.out.map(png), target === 'eps' ? 'hlrow' : ''))}
      <p class="note">${NOTES.unet}</p>
      <p class="note">노이즈 이미지는 −2를 검은색, +2를 흰색으로 표시했습니다.</p>`;
  },
  diffusion(st) { return diffusionEvidence(M.diffusion, st, false); },
  conditional(st) { return diffusionEvidence(M.conditional, st, true); },
  sd(st) {
    const view = st.view ?? 0;
    const tools = `<div class="ev-tools">${seg('view', ['잠재 공간', '학습 한 스텝', '생성 과정'], view)}</div>`;
    if (view === 0) {
      return `${tools}
        <div class="latent sd-row">
          <figure>${jpg(SD.image, '원본 이미지')}<figcaption><b>원본</b> 3×512×512 = 786,432개 값</figcaption></figure>
          <figure><div class="chs">${SD.latent_channels.map(c => pngPhoto(c, '잠재 채널')).join('')}</div><figcaption><b>VAE 인코더 출력</b> 4×64×64 = 16,384개 값을 채널별로 표시</figcaption></figure>
          <figure>${jpg(SD.recon, '복원 이미지')}<figcaption><b>VAE 디코더 복원</b> 16,384개 값에서 다시 만든 이미지</figcaption></figure>
        </div>
        <p class="note">${NOTES.sdLatent}</p>`;
    }
    if (view === 1) {
      const i = st.pick ?? 1;
      const s = SD.train_steps[i];
      return `${tools}
        <div class="ev-tools"><span class="lbl">시점 t</span>${seg('pick', SD.train_steps.map(x => `t = ${x.t}`), i)}</div>
        <div class="sd-row" style="--n:3">
          <figure>${jpg(s.zt, 'z_t를 디코더로 본 이미지')}<figcaption><b>UNet 입력 z_t</b> 디코더로 본 모습. 원본 비율 √ᾱ = ${s.keep}</figcaption></figure>
          <figure>${jpg(s.text.x0_hat, '캡션을 넣었을 때 복원')}<figcaption><b>캡션을 넣은 ε̂로 복원한 z0</b> MSE ${s.text.mse}</figcaption></figure>
          <figure>${jpg(s.empty.x0_hat, '빈 캡션일 때 복원')}<figcaption><b>빈 캡션의 ε̂로 복원한 z0</b> MSE ${s.empty.mse}</figcaption></figure>
        </div>
        <p class="note">${NOTES.sdTrain}</p>`;
    }
    const g = SD.generation;
    return `${tools}
      <div class="sd-row" style="--n:${g.frames.length}">${g.frames.map(f => `<figure>${jpg(f.image, '생성 중간 단계')}<figcaption><b>${f.step}/50</b> t = ${f.t}</figcaption></figure>`).join('')}</div>
      <div class="sd-row" style="--n:2">
        <figure>${jpg(g.final, 'CFG 7.5 결과')}<figcaption><b>guidance_scale 7.5</b> 기본값</figcaption></figure>
        <figure>${jpg(g.no_cfg, 'CFG 없는 결과')}<figcaption><b>guidance_scale 1.0</b> CFG를 끈 결과, 같은 seed</figcaption></figure>
      </div>
      <p class="note">${NOTES.sdGen}</p>`;
  },
};

function diffusionEvidence(D, st, conditional) {
  const views = conditional ? ['에폭별 생성', '같은 노이즈', '생성 과정', '배치 한 번'] : ['배치 한 번', '에폭별 생성', '생성 과정'];
  const view = st.view ?? 0;
  const name = views[view];
  const tools = `<div class="ev-tools">${seg('view', views, view)}</div>`;
  if (name === '배치 한 번') {
    const keys = Object.keys(D.views).map(Number).sort((a, b) => a - b);
    const i = st.pick ?? keys.length - 1;
    const v = D.views[keys[i]];
    return `${tools}
      <div class="ev-tools"><span class="lbl">학습 시점</span>${seg('pick', keys.map(epochLabel), i)}</div>
      ${grid(6, head(D.view_t.map((t, k) => conditional ? `t=${t}<br>레이블 ${[0, 2, 3, 5, 7, 8][k]}` : `t=${t}`))
        + row('<b>원본 x</b>', D.x0.map(png))
        + row('<b>정답 noise</b>', D.eps.map(png))
        + row('<b>입력 x_noisy</b>', v.xt.map(png))
        + row('<b>출력 ε̂</b>', v.eps_hat.map(png))
        + row('<b>ε̂로 복원한 x</b>', v.x0_hat.map(png))
        + row('<b>MSE</b>', v.mse.map(m => `<span class="cv">${m.toFixed(3)}</span>`)))}
      <p class="note">${conditional ? NOTES.condBatch : NOTES.diffBatch}</p>`;
  }
  if (name === '에폭별 생성') {
    if (conditional) {
      const i = st.pick ?? D.samples.length - 1;
      const s = D.samples[i];
      return `${tools}
        <div class="ev-tools"><span class="lbl">학습 시점</span>${seg('pick', D.samples.map(x => `${x.epoch} 에폭`), i)}</div>
        ${grid(10, head([...Array(10).keys()].map(d => `레이블 ${d}`))
          + row('<b>샘플 1</b>', s.images.slice(0, 10).map(png))
          + row('<b>샘플 2</b>', s.images.slice(10).map(png)))}
        <div class="stats">${D.losses.map((l, k) => `<span>${k + 1} 에폭 <b>${l.toFixed(4)}</b></span>`).join('')}</div>
        <p class="note">${NOTES.condEpochs}</p>`;
    }
    return `${tools}
      ${grid(10, D.samples.map(s => row(`<b>${s.epoch} 에폭</b>손실 ${D.losses[s.epoch - 1].toFixed(4)}`, s.images.map(png))).join(''))}
      <p class="note">${NOTES.diffEpochs}</p>`;
  }
  if (name === '같은 노이즈') {
    return `${tools}
      ${grid(10, head([...Array(10).keys()].map(d => `레이블 ${d}`))
        + row('<b>시작 노이즈</b>10장 모두 같음', Array(10).fill(png(D.shared_noise_start)))
        + row('<b>생성 결과</b>', D.shared_noise.map(png)))}
      <p class="note">${NOTES.condShared}</p>`;
  }
  const tr = D.trajectory;
  const sampleLabels = conditional ? [0, 2, 3, 5, 7, 8].map(d => `<b>레이블 ${d}</b>`) : [1, 2, 3, 4, 5, 6].map(k => `<b>샘플 ${k}</b>`);
  return `${tools}
    ${grid(tr.steps.length, head(tr.steps.map(s => s === 1000 ? '시작' : s === 0 ? '완료' : `t=${s}`))
      + sampleLabels.map((lab, k) => row(lab, tr.frames.map(col => png(col[k])))).join(''))}
    <p class="note">${conditional ? NOTES.condTraj : NOTES.traj}</p>`;
}

때의 MSE는 t = 200에서 0.3052와 0.3060, t = 800에서 0.0163과 0.0166으로 거의 같습니다. 한 단계에서 텍스트가 예측을 바꾸는 정도가 이만큼 작기 때문에, 생성할 때 CFG로 그 차이를 7.5배로 키웁니다.", "sdGen": "중간 latents를 VAE 디코더로 보면 20단계까지는 노이즈만 보이고, 30단계에서 고양이 윤곽이 나타납니다. CFG를 끄면 같은 seed에서도 프롬프트와 관계없는 장면이 나옵니다. 7.5로 생성한 결과도 물고기가 고양이를 타는 장면이 아니라 고양이가 물고기를 잡는 장면입니다. CLIP 텍스트 인코더가 단어 사이의 관계를 잘 반영하지 못한다는 앞의 설명과 맞는 결과입니다.", "condTraj": "레이블을 넣어도 모든 생성이 성공하지는 않습니다. 이 여섯 장 중 레이블 0, 5, 8은 숫자로 알아보기 어려운 모양이 나왔습니다. 한 단계에서 레이블이 예측을 바꾸는 정도가 작기 때문이고, Stable Diffusion은 이 차이를 키우려고 CFG를 씁니다."};

/* ---------------------------------------------------------------- 렌더링 */
const SUBVIEWS = ['구조', '개념 정리', '학습 흐름', '학습 결과'];
const state = Object.fromEntries(TABS.map(t => [t.id, { sv: 0, av: 0, mode: 0, node: 0 }]));
const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');
tabsEl.innerHTML = TABS.map(t => `<button class="tab" role="tab" id="tab-${t.id}" aria-controls="panel-${t.id}" aria-selected="false" tabindex="-1" data-tab="${t.id}"><b>${t.name}</b><small>${t.sub}</small></button>`).join('');
panelsEl.innerHTML = TABS.map(t => `<section class="panel" role="tabpanel" id="panel-${t.id}" aria-labelledby="tab-${t.id}" hidden></section>`).join('');

const val = v => typeof v === 'function' ? v() : v;
const partInfo = p => `<div class="info-top"><h3>${p.title}</h3><span class="badge">${BADGE[p.kind]}</span></div><div class="shape">${val(p.meta)}</div><p>${val(p.desc)}</p>`;

function archHTML(tab, st) {
  const views = ARCH[tab.id];
  const view = views[st.av];
  const parts = view.parts();
  if (!parts[st.part]) st.part = view.first;
  const p = parts[st.part];
  return `<div class="card">
    <div class="card-top"><h3>${view.label}</h3>${views.length > 1 ? seg('av', views.map(v => v.label), st.av) : ''}</div>
    <div class="svg-wrap">${view.svg()}</div>
    <p class="code-cap">${view.cap}</p>
    <div class="info part-info" data-kind="${p.kind}" aria-live="polite">${partInfo(p)}</div>
  </div>`;
}

function conceptsHTML(tab) {
  return `<div class="card"><dl class="concepts">${CONCEPTS[tab.id].map(([term, body, without]) => `<div class="concept"><dt>${term}</dt><dd><p>${body}</p>${without ? `<p class="without"><b>없을 때:</b> ${without}</p>` : ''}</dd></div>`).join('')}</dl></div>`;
}

function flowHTML(tab, st) {
  const mode = tab.modes[st.mode];
  const node = mode.nodes[st.node];
  const on = new Set(node.lines);
  const badge = node.gen ? '학습을 마친 부품' : BADGE[node.kind];
  return `<div class="card">
    <div class="card-top"><h3>${tab.id === 'unet' ? '학습 한 스텝' : mode.label}</h3>${seg('mode', tab.modes.map(m => m.label), st.mode)}</div>
    <div class="lab-grid">
      <ol class="flow">${mode.nodes.map((n, i) => `<li><button type="button" class="node" data-kind="${n.kind}" data-node="${i}" ${i === st.node ? 'aria-current="step"' : ''}><span class="num">${i + 1}</span><span class="nl">${n.label}</span><span class="ns">${n.shape}</span></button></li>`).join('')}</ol>
      <div class="detail">
        <div class="info" data-kind="${node.kind}">
          <div class="info-top"><h3>${node.label}</h3><span class="badge">${badge}</span></div>
          <div class="shape">${node.shape}</div>
          <p>${val(node.desc)}</p>
        </div>
        <div class="stepper"><button type="button" class="btn" data-step="-1" ${st.node === 0 ? 'disabled' : ''}>이전</button><span class="count">${st.node + 1} / ${mode.nodes.length}</span><button type="button" class="btn" data-step="1" ${st.node === mode.nodes.length - 1 ? 'disabled' : ''}>다음</button></div>
      </div>
    </div>
    <pre class="code" aria-label="코드">${mode.code.map((l, i) => `<span class="ln${on.has(i) ? ' on' : ''}">${esc(l)}</span>`).join('')}</pre>
    ${mode.codeCap ? `<p class="code-cap">${mode.codeCap}</p>` : ''}
  </div>`;
}

function markParts(panel, tab, st) {
  const parts = ARCH[tab.id][st.av].parts();
  const seen = new Set();
  panel.querySelectorAll('svg [data-part]').forEach(g => {
    const id = g.dataset.part;
    g.classList.toggle('on', id === st.part);
    if (!seen.has(id)) {
      seen.add(id);
      g.setAttribute('tabindex', '0');
      g.setAttribute('role', 'button');
      if (parts[id]) g.setAttribute('aria-label', parts[id].title.replace(/<[^>]+>/g, ''));
    }
  });
}

function selectPart(panel, tab, st, id) {
  const parts = ARCH[tab.id][st.av].parts();
  if (!parts[id]) return;
  st.part = id;
  markParts(panel, tab, st);
  const info = panel.querySelector('.part-info');
  info.dataset.kind = parts[id].kind;
  info.innerHTML = partInfo(parts[id]);
}

function renderPanel(tab) {
  const el = document.getElementById(`panel-${tab.id}`);
  if (tab.compare) { el.innerHTML = compareHTML(); return; }
  const st = state[tab.id];
  const why = WHY[tab.id];
  const body = st.sv === 0 ? archHTML(tab, st)
    : st.sv === 1 ? conceptsHTML(tab)
    : st.sv === 2 ? flowHTML(tab, st)
    : `<div class="card ev"><div class="card-top"><h3>실제 학습 결과</h3></div>${EVIDENCE[tab.id](st, tab)}</div>`;
  el.innerHTML = `
    <div class="panel-head">
      <p class="eyebrow">${tab.file}</p>
      <h2>${tab.name}</h2>
      <p>${tab.summary}</p>
    </div>
    <div class="why">${['before', 'add', 'left'].map(k => `<div class="${k}"><h4>${why[k][0]}</h4><p>${why[k][1]}</p></div>`).join('')}</div>
    <div class="views">${seg('sv', SUBVIEWS, st.sv)}</div>
    ${body}`;
  if (st.sv === 0) markParts(el, tab, st);
}

function select(id, focus) {
  const tab = TABS.find(t => t.id === id) || TABS[0];
  TABS.forEach(t => {
    const b = document.getElementById(`tab-${t.id}`);
    const selected = t.id === tab.id;
    b.setAttribute('aria-selected', selected);
    b.tabIndex = selected ? 0 : -1;
    const panel = document.getElementById(`panel-${t.id}`);
    panel.hidden = !selected;
    if (!selected) panel.innerHTML = '';
  });
  renderPanel(tab);
  if (focus) document.getElementById(`tab-${tab.id}`).focus();
  if (location.hash.slice(1) !== tab.id) history.replaceState(null, '', `#${tab.id}`);
}

tabsEl.addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) select(b.dataset.tab); });
tabsEl.addEventListener('keydown', e => {
  if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
  const i = TABS.findIndex(t => document.getElementById(`tab-${t.id}`).getAttribute('aria-selected') === 'true');
  const next = e.key === 'Home' ? 0 : e.key === 'End' ? TABS.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + TABS.length) % TABS.length;
  select(TABS[next].id, true);
  e.preventDefault();
});

const KEYS = ['sv', 'av', 'mode', 'node', 'step', 'view', 'pick'];
function handle(e) {
  const panel = e.target.closest('.panel');
  if (!panel) return;
  const tab = TABS.find(t => `panel-${t.id}` === panel.id);
  if (tab.compare) return;
  const st = state[tab.id];
  const partEl = e.target.closest('svg [data-part]');
  if (partEl) { selectPart(panel, tab, st, partEl.dataset.part); return; }
  const b = e.target.closest('button');
  if (!b) return;
  const key = KEYS.find(k => b.dataset[k] !== undefined);
  if (!key) return;
  const v = +b.dataset[key];
  if (key === 'sv') st.sv = v;
  else if (key === 'av') { st.av = v; st.part = undefined; }
  else if (key === 'mode') { st.mode = v; st.node = Math.min(st.node, tab.modes[v].nodes.length - 1); }
  else if (key === 'node') st.node = v;
